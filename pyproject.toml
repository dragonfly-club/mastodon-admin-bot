[project]
name = "mastodon-admin-bot"
version = "0.1.0"
description = "Telegram moderation bot for Mastodon admin webhooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.29.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.4",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.18",
]

[project.scripts]
mastodon-admin-bot = "mastodon_admin_bot.main:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
